dynamixel_arm_driver:
  ros__parameters:
    # Prefer /dev/serial/by-id/... on the flight computer. /dev/dynamixel is kept
    # as a compatible fallback for the already-installed udev rule.
    usb_port: /dev/ttyUSB3
    baudrate: 1000000
    protocol_version: 2.0
    publish_rate_hz: 100.0

    motor_ids: [1, 2, 3, 4]
    joint_names: [J1, J2, J3, J4]
    joint_direction: [1.0, 1.0, 1.0, 1.0]
    joint_offset_rad: [0.0, 0.0, 0.0, 0.0]

    # J2 is intentionally restricted to 0--30 degrees for the temporary flight test.
    joint_min_rad: [-1.5708, 0.0, -1.5708, -3.14159]
    joint_max_rad: [1.5708, 0.5235987756, 1.5708, 3.14159]

    torque_on_at_startup: false
    capture_zero_on_torque_enable: true
    disable_torque_on_shutdown: true
