keyboard_teleop_chr:
  ros__parameters:
    publish_rate_hz: 50.0
    translation_step_m: 0.01
    rotation_step_deg: 3.0
    workspace_min: [-2.0, -2.0, 0.05]
    workspace_max: [2.0, 2.0, 3.0]

    # Conservative first-flight trajectory around the EE pose at the G-key event.
    trajectory_amplitude_m: [0.04, 0.04, 0.025]
    trajectory_frequency_hz: [0.05, 0.10, 0.05]
    trajectory_ramp_in_s: 3.0
