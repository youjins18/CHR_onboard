keyboard_teleop_chr:
  ros__parameters:
    publish_rate_hz: 50.0
    # Keep the experiment armed, but start flight DOB disabled.
    # Motion still waits for every chr_controller safety gate.
    dob_enabled_at_startup: false
    experiment_enabled_at_startup: true
    translation_step_m: 0.01
    rotation_step_deg: 3.0
    workspace_min: [-2.0, -2.0, 0.05]
    workspace_max: [2.0, 2.0, 3.0]

    # The G-key predefined trajectory is configured in
    # chr_controller/config/chr_controller.yaml.
